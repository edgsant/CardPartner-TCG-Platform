<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <title>Card Partner - Creador de Mazos</title>
    <link rel="stylesheet" href="../css/deckBuilderStyle.css?v=4">
</head>
<body>

    <div class="fondo-rosa">
        <div class="contenedor-principal">
            
            <header class="cabecera">
                <a href="../index.html" class="logo">
                    <img src="../img/logo.png" alt="Logo de la Empresa">
                </a>
                <div class="fila-de-botones">
                    <div class="mi-desplegable">
                        <a href="tcg.html" style="text-decoration: none;">
                            <button class="mi-boton">TCGS</button>
                        </a>
                    </div>
                    <div class="mi-desplegable">
                        <button class="mi-boton">SOCIAL ▾</button>
                        <div class="mi-submenu">
                            <a href="news.html">NEWS</a>
                            <a href="tournaments.html">TOURNAMENTS</a>
                            <a href="guides.html">GUIDES</a>
                        </div>
                    </div>
                    <div class="mi-desplegable">
                        <a href="#" style="text-decoration: none;">
                            <button class="mi-boton">DECKS ▾</button>
                        </a>
                        <div class="mi-submenu">
                            <a href="community-deck.html">Community decks</a>
                            <a href="meta-decks.html">META Decks</a>
                            <a href="deck-builder.html">Creador de mazos</a>
                        </div>
                    </div>
                    <a href="cards.html" class="mi-boton">CARDS</a>
                </div>
                <div class="login">
                    <a href="login.html" style="text-decoration: none;">
                        <button>SIGN IN<br>LOGIN</button>
                    </a>
                </div>
            </header>

            <main class="contenido-builder">
                
                <div class="barra-superior-builder">
                    <h2 class="titulo-seccion">DECK BUILDER</h2>
                    <a href="perfil.html" class="btn-guardar" style="text-decoration: none; display: inline-block;">💾 Guardar Mazo</a>
                </div>

                <div class="builder-header">
                    
                    <div class="lider-slot">
                        <h3>LÍDER SELECCIONADO</h3>
                        <div class="imagen-contenedor">
                            <img src="../img/lider-sakazuki.jpg" alt="Líder Sakazuki">
                        </div>
                        <a href="#modalLideres" class="btn-cambiar" style="text-decoration: none; text-align: center; display: inline-block;">Cambiar Líder</a>
                    </div>

                    <div class="deck-detalles">
                        <h3>INFORMACIÓN DEL MAZO</h3>
                        <div class="campo-form">
                            <label>Nombre del Mazo:</label>
                            <input type="text" value="Control Sakazuki V2">
                        </div>
                        <div class="campo-form">
                            <label>Descripción / Estrategia:</label>
                            <textarea rows="3">Mazo centrado en control de mesa. Bajar coste a los personajes rivales y usar a Rob Lucci para eliminarlos.</textarea>
                        </div>
                        <div class="campo-form">
                            <label>Visibilidad:</label>
                            <select style="font-family: 'Poppins', sans-serif; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
                                <option>Público (Visible en Community Decks)</option>
                                <option>Privado (Solo visible en mi Perfil)</option>
                            </select>
                        </div>
                        <div class="estadisticas-builder" style="margin-top: 15px;">
                            <span class="stat-badge">Cartas: 8 / 50</span>
                            <span class="stat-badge color-azul">Color: Azul</span>
                            <span class="stat-badge color-negro">Color: Negro</span>
                        </div>
                    </div>

                </div>

                <div class="builder-cartas-seccion">
                    
                    <div class="cabecera-cartas">
                        <h3>CARTAS AÑADIDAS</h3>
                        <a href="#modalCartas" class="btn-buscar-cartas" style="text-decoration: none; text-align: center; display: inline-block;">+ Buscar Cartas</a>
                    </div>

                    <div class="deck-grid">
                        <div class="carta-wrapper">
                            <img src="../img/op01-120.jpg" alt="Shanks" class="carta-pequena">
                            <span class="cantidad-carta">x2</span>
                            <a href="#" class="btn-quitar" style="text-decoration: none;">x</a>
                        </div>
                        <div class="carta-wrapper">
                            <img src="../img/op01-025.jpg" alt="Zoro" class="carta-pequena">
                            <span class="cantidad-carta">x4</span>
                            <a href="#" class="btn-quitar" style="text-decoration: none;">x</a>
                        </div>
                        <div class="carta-wrapper">
                            <img src="../img/op05-119.jpg" alt="Luffy" class="carta-pequena">
                            <a href="#" class="btn-quitar" style="text-decoration: none;">x</a>
                        </div>
                        <div class="carta-wrapper">
                            <img src="../img/op01-047.jpg" alt="Law" class="carta-pequena">
                            <a href="#" class="btn-quitar" style="text-decoration: none;">x</a>
                        </div>

                        <div class="slot-vacio"></div>
                        <div class="slot-vacio"></div>
                        <div class="slot-vacio"></div>
                        <div class="slot-vacio"></div>
                        <div class="slot-vacio"></div>
                        <div class="slot-vacio"></div>
                        <div class="slot-vacio"></div>
                        <div class="slot-vacio"></div>
                        <div class="slot-vacio"></div>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <div id="modalLideres" class="modal-overlay">
        <div class="modal-content">
            <a href="#" class="btn-cerrar">&times;</a>
            <h2 class="titulo-seccion" style="margin-bottom: 20px; font-size: 24px; text-align: left;">SELECCIONA TU LÍDER</h2>
            <div class="grid-seleccion">
                <a href="#"><img src="../img/lider-sakazuki.jpg" alt="Sakazuki" class="img-lider-opcion"></a>
                <a href="#"><img src="../img/lider-zoro.jpg" alt="Zoro" class="img-lider-opcion"></a>
                <a href="#"><img src="../img/lider-enel.jpg" alt="Enel" class="img-lider-opcion"></a>
                <a href="#"><img src="../img/lider-katakuri.jpg" alt="Katakuri" class="img-lider-opcion"></a>
            </div>
        </div>
    </div>

    <div id="modalCartas" class="modal-overlay">
        <div class="modal-content">
            <a href="#" class="btn-cerrar">&times;</a>
            <h2 class="titulo-seccion" style="margin-bottom: 10px; font-size: 24px; text-align: left;">AÑADIR CARTA</h2>
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" placeholder="Buscar por nombre, ID, efecto..." style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Poppins', sans-serif;">
                <select style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Poppins', sans-serif;">
                    <option>Filtrar por Coste</option>
                    <option>Coste 1-3</option>
                    <option>Coste 4-6</option>
                    <option>Coste 7+</option>
                </select>
            </div>

            <div class="grid-seleccion">
                <a href="#"><img src="../img/op01-120.jpg" alt="Shanks" class="img-carta-opcion"></a>
                <a href="#"><img src="../img/op01-025.jpg" alt="Zoro" class="img-carta-opcion"></a>
                <a href="#"><img src="../img/op05-119.jpg" alt="Luffy" class="img-carta-opcion"></a>
                <a href="#"><img src="../img/op01-047.jpg" alt="Law" class="img-carta-opcion"></a>
                <a href="#"><img src="../img/op01-016.jpg" alt="Nami" class="img-carta-opcion"></a>
            </div>
        </div>
    </div>

</body>
</html>
